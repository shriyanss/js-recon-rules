id: detect_hardcoded_secrets
name: Hardcoded credentials / API keys in JS bundle
author: shriyanss
js_recon_version: ">=1.4.1-alpha.4"
description: >-
    Detects string literals in compiled JavaScript that match well-known credential
    formats: Stripe live secret keys (sk_live_), SendGrid API keys (SG.<base64>),
    Slack bot tokens (xoxb-), webhook secrets (whsec_), GitHub App private keys
    (-----BEGIN RSA PRIVATE KEY-----), GitHub App IDs (Iv1.), and generic
    analytics keys starting with "sk-". These values are compiled into the bundle
    at build time and are accessible to anyone who can fetch the JS file — no
    authentication required. Skips values whose credential body is a run of
    10+ identical characters immediately after the prefix (e.g.
    sk_live_xxxxxxxxxxxxxxxxxxxx or whsec_00000000000000000000), since these
    are masked/placeholder display values rather than real secrets.
severity: high
type: ast
tech:
    - react
    - next
    - vue
    - svelte
    - angular

steps:
    - name: find_secret_literal
      message: Hardcoded credential / API key found in JS bundle
      regexMatch:
          pattern: "(sk_live_(?!(.)\\2{9,})[A-Za-z0-9]{10,}|SG\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+|xoxb-[0-9]+-[0-9]+-[A-Za-z0-9]+|whsec_(?!(.)\\3{9,})[A-Za-z0-9]{10,}|-----BEGIN RSA PRIVATE KEY-----|Iv1\\.[a-z0-9]{10,}|sk-(?!(.)\\4{9,})[a-zA-Z0-9\\-]{10,})"
