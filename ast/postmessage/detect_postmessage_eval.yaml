id: detect_postmessage_eval
name: eval() sink reachable via postMessage handler (no origin check)
author: shriyanss
js_recon_version: ">=1.4.1-alpha.4"
description: >-
    Detects a chunk that (1) registers a window.addEventListener('message', ...)
    handler and (2) contains an eval() call, with no event.origin validation
    present. Any cross-origin page that can open or embed this page can send
    an arbitrary postMessage payload which will be eval()ed in the victim
    origin's context — a full arbitrary-code-execution / DOM XSS primitive.
    The rule fires when both primitives coexist in the same chunk, which is a
    strong signal that the eval() is reachable from the message handler.
    Requires the listener target to be `window` specifically, so it doesn't
    fire on unrelated "message"-event listeners on other objects (a Web
    Worker, WebSocket, EventSource, or BroadcastChannel), which aren't
    reachable by a cross-origin postMessage sender.
remediation: >-
    Remove the eval() call from the message handler entirely, and always
    validate event.origin against an exact allowlist of trusted origins before
    processing any postMessage payload. Never execute message data as code
    under any circumstances.
severity: high
type: ast
tech:
    - react
    - next
    - svelte
    - vue
    - angular

steps:
    - name: find_postmessage_listener
      message: window.addEventListener('message', ...) handler found
      esquery:
          type: esquery
          query: ':matches(CallExpression[callee.object.name="window"][callee.property.name="addEventListener"][arguments.0.value="message"], CallExpression[callee.object.name="window"][callee.property.name="addEventListener"][arguments.0.quasis.0.value.raw="message"])'

    - name: find_eval_in_chunk
      message: eval() call found in the same chunk as the postMessage listener
      requires:
          - find_postmessage_listener
      esquery:
          type: esquery
          query: 'CallExpression[callee.name="eval"]'
