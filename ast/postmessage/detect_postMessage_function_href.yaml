id: detect_postMessage_function_href
name: Detect .href in the event handler for postMessage event handler
author: shriyanss
js_recon_version: ">=1.4.1-alpha.4"
description: Detect .href in the event handler for postMessage event handler
remediation: >-
    Validate event.origin against an exact-match allowlist before the handler
    runs, and never assign postMessage-derived data directly to `.href` —
    validate it against an allowlist of expected values/paths first.
severity: medium
type: ast
tech:
    - next
    - svelte
    - angular

steps:
    - name: check_postMessage
      message: postMessage event listener detected
      esquery:
          type: esquery
          query: CallExpression[callee.object.name="window"][callee.property.name="addEventListener"][arguments.0.value="message"][arguments.1]
    # now, check if the second argument is a function and it has call to innerHtml
    - name: resolve_event_handler_function
      message: Code for postmessage event handler
      requires:
          - check_postMessage
      postMessageFuncResolve:
          name: check_postMessage
    - name: check_href
      message: detects if there .href is there in the code
      requires:
          - resolve_event_handler_function
      checkAssignmentExist:
          name: resolve_event_handler_function
          type: href
          memberExpression: true
