id: detect_cloud_credentials_in_bundle
name: Hardcoded cloud-provider credentials in JS bundle
author: shriyanss
js_recon_version: ">=1.4.1-alpha.4"
description: >-
    Detects string literals in compiled JavaScript that match well-known
    cloud-provider credential formats: AWS access key IDs (AKIA.../ASIA...)
    and Google Cloud API keys (AIza...). These values are compiled into the
    bundle at build time and are accessible to anyone who can fetch the JS
    file — no authentication required. AWS access key IDs in particular are
    long-lived IAM credentials rather than a scoped browser key, so a match
    here is high-value even before any secret-key pairing is confirmed.
    Skips AWS's own documentation placeholder (AKIAIOSFODNN7EXAMPLE) and any
    match whose body is a run of 10+ identical characters, since these are
    masked/placeholder display values rather than real credentials.
severity: high
type: ast
tech:
    - react
    - next
    - vue
    - svelte
    - angular

steps:
    - name: find_cloud_credential_literal
      message: Hardcoded cloud-provider credential found in JS bundle
      regexMatch:
          pattern: "((AKIA|ASIA)(?!IOSFODNN7EXAMPLE)(?!(.)\\3{9,})[0-9A-Z]{16}|AIza(?!(.)\\4{30,})[0-9A-Za-z_-]{35})"
