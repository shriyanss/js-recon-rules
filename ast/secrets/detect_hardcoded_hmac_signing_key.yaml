id: detect_hardcoded_hmac_signing_key
name: Hardcoded HMAC signing key fed into createHmac
author: shriyanss
js_recon_version: ">=1.4.1-alpha.4"
description: >-
    Detects a `crypto.createHmac(algorithm, key)` (or a destructured
    `createHmac(algorithm, key)`) call whose `key` argument is a string
    literal rather than a value read from a server response or a
    request-scoped input. If the client signs or verifies a token/message
    with a key baked into the bundle, anyone who downloads the JS can extract
    the key and forge a signature the server will accept — this holds
    regardless of the key's format or entropy, since the vulnerability is in
    how the value is used (as a signing secret) rather than what it looks
    like. Requires the key literal to be at least 8 characters to avoid
    flagging trivially empty/placeholder arguments.
remediation: >-
    Remove the hardcoded signing key from client code and move HMAC
    signing/verification to the server, where the key can stay secret. If the
    client only needs to verify a server-issued signature, have the server hand
    out a short-lived, scoped token instead of a static shared secret.
severity: high
type: ast
tech:
    - react
    - next
    - vue
    - svelte
    - angular

steps:
    - name: find_hardcoded_hmac_key
      message: crypto.createHmac() called with a hardcoded string literal as the signing key
      esquery:
          type: esquery
          query: ':matches(CallExpression[callee.type="MemberExpression"][callee.property.name="createHmac"][arguments.1.type="StringLiteral"][arguments.1.value=/^.{8,}$/], CallExpression[callee.type="Identifier"][callee.name="createHmac"][arguments.1.type="StringLiteral"][arguments.1.value=/^.{8,}$/])'
