id: detect_ajax_header_manipulation
name: Ajax Request-Header Manipulation via URL parameter
author: shriyanss
js_recon_version: ">=1.4.1-alpha.4"
description: >-
    Detects a `fetch(url, { headers: { [k]: v } })` call where the `headers`
    object has a computed-key property — the header name is variable. Combined
    with a URL-derived value being read in the same chunk, this is the classic
    pattern that lets an attacker spoof `Authorization`, `X-Forwarded-For`,
    `X-Admin-Override`, or any other header that backend middleware trusts.
    Fires when both patterns appear in the same chunk/module. Excludes
    bracket-notation properties whose key is actually a fixed string (a plain
    string literal or an interpolation-free template literal, e.g.
    `["Content-Type"]: v`), since the header name isn't attacker-controllable
    in that case even though the AST shape is a computed property.
remediation: >-
    Never use a URL/query-string value to select or build the name of an
    outgoing header. Whitelist a small fixed set of header names in code and
    validate header values against what the backend expects; reject any header
    name/value pair a client tries to set from user-controlled input.
severity: high
type: ast
tech:
    - next
    - svelte
    - angular

steps:
    - name: find_url_param_source
      message: URL-derived value read (URLSearchParams.get / location.search|hash / document.referrer|URL / useSearchParams)
      esquery:
          type: esquery
          query: ':matches(CallExpression[callee.type="MemberExpression"][callee.property.name="get"][callee.object.type="NewExpression"][callee.object.callee.name="URLSearchParams"], MemberExpression[property.name="search"][object.property.name="location"], MemberExpression[property.name="search"][object.name="location"], MemberExpression[property.name="hash"][object.property.name="location"], MemberExpression[property.name="hash"][object.name="location"], MemberExpression[property.name="referrer"][object.name="document"], MemberExpression[property.name="URL"][object.name="document"], CallExpression[callee.type="MemberExpression"][callee.property.name="useSearchParams"], CallExpression[callee.name="useSearchParams"])'

    - name: find_computed_header_key
      message: fetch headers object contains a computed-key property (variable header name)
      requires:
          - find_url_param_source
      esquery:
          type: esquery
          taintFrom: find_url_param_source
          query: 'ObjectProperty[key.name="headers"][value.type="ObjectExpression"] > ObjectExpression > ObjectProperty[computed=true]:not([key.type="StringLiteral"]):not([key.expressions.length=0])'
