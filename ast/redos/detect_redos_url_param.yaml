id: detect_redos_url_param
name: DOM-based ReDoS via URL parameter into RegExp
author: shriyanss
js_recon_version: ">=1.4.1-alpha.4"
description: >-
    Detects `new RegExp(X)` (or `RegExp(X)`) instantiation when a URL-derived
    value is read in the same chunk/module. JavaScript is single-threaded,
    so a catastrophic-backtracking pattern from the URL freezes the victim's
    tab — a client-side denial of service. Fires when both patterns appear
    in the same chunk/module. Skips the sink if the pattern is the direct
    return of a call to a regex-escaping helper (e.g. lodash's escapeRegExp),
    since escaping metacharacters removes the backtracking-quantifier
    primitives ReDoS depends on.
remediation: >-
    Never build a RegExp pattern directly from URL-derived input. If dynamic
    matching against user input is required, escape all regex metacharacters
    first (e.g. lodash's escapeRegExp) so the value can only match literally,
    not act as a pattern.
severity: medium
type: ast
tech:
    - next
    - svelte
    - angular

steps:
    - name: find_url_param_source
      message: URL-derived value read (URLSearchParams.get / location.search|hash / document.referrer|URL / useSearchParams)
      esquery:
          type: esquery
          query: ':matches(CallExpression[callee.type="MemberExpression"][callee.property.name="get"][callee.object.type="NewExpression"][callee.object.callee.name="URLSearchParams"], MemberExpression[property.name="search"][object.property.name="location"], MemberExpression[property.name="search"][object.name="location"], MemberExpression[property.name="hash"][object.property.name="location"], MemberExpression[property.name="hash"][object.name="location"], MemberExpression[property.name="referrer"][object.name="document"], MemberExpression[property.name="URL"][object.name="document"], CallExpression[callee.type="MemberExpression"][callee.property.name="useSearchParams"], CallExpression[callee.name="useSearchParams"])'

    - name: find_regexp_sink
      message: new RegExp() / RegExp() with a non-literal pattern (potential ReDoS sink)
      requires:
          - find_url_param_source
      esquery:
          type: esquery
          taintFrom: find_url_param_source
          query: ':matches(NewExpression[callee.name="RegExp"]:not([arguments.0.type="StringLiteral"]):not([arguments.0.type="RegExpLiteral"]):not(:matches([arguments.0.callee.name=/^(escapeRegExp|escapeRegex|quoteRegExp|regExpEscape)$/i], [arguments.0.callee.property.name=/^(escapeRegExp|escapeRegex|quoteRegExp|regExpEscape)$/i])), CallExpression[callee.name="RegExp"]:not([arguments.0.type="StringLiteral"]):not([arguments.0.type="RegExpLiteral"]):not(:matches([arguments.0.callee.name=/^(escapeRegExp|escapeRegex|quoteRegExp|regExpEscape)$/i], [arguments.0.callee.property.name=/^(escapeRegExp|escapeRegex|quoteRegExp|regExpEscape)$/i])))'
