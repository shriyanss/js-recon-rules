id: detect_dom_xss_dangerouslySetInnerHTML
name: DOM XSS via raw-HTML sink (React dangerouslySetInnerHTML / Vue v-html) with dynamic value
author: shriyanss
js_recon_version: ">=1.3.1-alpha.3"
description: >-
    Detects a likely DOM-XSS sink: a raw-HTML prop assigned a non-literal value.
    Covers React's `dangerouslySetInnerHTML={{ __html: X }}` (compiled as an
    ObjectProperty with key `__html`) and Vue's `v-html="X"` directive (compiled
    by Vite/Vue's template compiler to an ObjectProperty `{ innerHTML: X }`
    paired with a `["innerHTML"]` patchFlag tuple). This rule pairs the dynamic
    sink with the presence of a `fetch()` call in the same module, indicating
    that the rendered HTML likely originates from a server response (e.g. a
    comment body, post content, or user-controllable record). Skips the sink if
    the assigned value is the direct return of a call to a common
    sanitizer/encoder function (e.g. DOMPurify.sanitize, sanitizeHtml, escapeHtml).
remediation: >-
    Sanitize the HTML with DOMPurify (or an equivalent, actively-maintained
    sanitizer) immediately before passing it to dangerouslySetInnerHTML/v-html;
    avoid rendering raw server/response HTML unless a sanitization step sits
    directly in the render path.
severity: high
type: ast
tech:
    - next
    - vue
    - react

steps:
    - name: find_fetch_call
      message: fetch() call present in the module (likely the source feeding the raw-HTML sink)
      esquery:
          type: esquery
          query: ':matches(CallExpression[callee.name="fetch"], CallExpression[callee.type="MemberExpression"][callee.property.name="fetch"])'

    - name: find_raw_html_sink_dynamic
      message: Raw-HTML sink (__html / innerHTML) assigned a non-literal value (XSS sink)
      requires:
          - find_fetch_call
      esquery:
          type: esquery
          query: ':matches(ObjectProperty[key.name="__html"], ObjectProperty[key.name="innerHTML"]):not([value.type="StringLiteral"]):not([value.type="TemplateLiteral"]):not([value.type="NullLiteral"]):not([value.type="NumericLiteral"]):not([value.type="BooleanLiteral"]):not(:matches([value.callee.name=/^(sanitize|sanitizeHtml|sanitizeHTML|purify|escapeHtml|escapeHTML|escape|clean|encode|encodeHTML)$/i], [value.callee.property.name=/^(sanitize|sanitizeHtml|sanitizeHTML|purify|escapeHtml|escapeHTML|escape|clean|encode|encodeHTML)$/i]))'
