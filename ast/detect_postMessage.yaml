id: detect_postMessage
name: Detect postMessage event listeners
author: shriyanss
js_recon_version: ">=1.3.0"
description: Detect postMessage event listeners
severity: info
type: ast
tech:
    - next
    - react
    - svelte

steps:
    - name: check_postMessage
      message: postMessage event listener detected
      esquery:
          type: esquery
          query: ':matches(CallExpression[callee.object.name="window"][callee.property.name="addEventListener"][arguments.0.value="message"][arguments.1], CallExpression[callee.object.name="window"][callee.property.name="addEventListener"][arguments.0.quasis.0.value.raw="message"][arguments.1])'
