id: api_path
name: API Path
author: shriyanss
js_recon_version: ">=1.3.1-alpha.3"
description: Check if the URL is a common API path
tech:
    - all
severity: info
type: request

steps:
    - name: check_api_path
      message: URL is a common API path
      request:
          type: url
          condition: contains
          name: "/api/"
