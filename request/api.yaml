id: api_path
name: API Path
author: shriyanss
js_recon_version: ">=1.3.1-alpha.3"
description: Check if the URL is a common API path
tech:
    - all
remediation: >-
    Informational: no remediation required by itself — this classifies an
    endpoint as an API path. Ensure any endpoint identified this way has the
    correct authentication and authorization applied server-side.
severity: info
type: request

steps:
    - name: check_api_path
      message: URL is a common API path
      request:
          type: url
          condition: contains
          name: "/api/"
