id: admin_api
name: Detect Admin API endpoints
author: shriyanss
js_recon_version: ">=1.3.0"
description: Detect endpoints that have both "admin" and "api" in the path
severity: info
type: request
tech:
    - next

steps:
    - name: check_api
      message: API endpoint detected
      request:
          type: url
          condition: contains
          name: "/api/"
    - name: check_admin
      message: Admin API endpoint detected
      requires:
          - check_api
      request:
          type: url
          condition: contains
          name: "admin"
