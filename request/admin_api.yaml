id: admin_api
name: Detect Admin API endpoints
author: shriyanss
js_recon_version: ">=1.3.1-alpha.3"
description: Detect endpoints that have both "admin" and "api" in the path
remediation: >-
    Informational: confirm every endpoint under an admin path enforces server-
    side authentication and role-based authorization; don't rely on a non-
    obvious path alone as protection (security by obscurity).
severity: info
type: request
tech:
    - all

steps:
    - name: check_api
      message: API endpoint detected
      request:
          type: url
          condition: contains
          name: "/api/"
    - name: check_admin
      message: Admin API endpoint detected
      requires:
          - check_api
      request:
          type: url
          condition: contains
          name: "admin"
