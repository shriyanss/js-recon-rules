name: Push Checks

on:
  push:
    branches-ignore:
      - main

jobs:
  version_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version number
        run: |
          echo "[i] Checking if the version in the CHANGELOG.md and version.txt matches"
          CHANGELOG_VERSION=$(cat CHANGELOG.md | grep -E "^## [0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?" | head -n 1 | sed -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?).*/\1/')
          VERSION_TXT_VERSION=$(cat version.txt)
          if [[ "$CHANGELOG_VERSION" != "$VERSION_TXT_VERSION" ]]; then
            echo "Version number mismatch between CHANGELOG_VERSION and VERSION_TXT_VERSION"
            exit 1
          else
            echo "[✓] Version matches"
          fi

  prettify:
    runs-on: ubuntu-latest
    needs: version_check
    environment: commit-signing
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Configure SSH commit signing
        uses: shriyanss/verified-commit-action@v1
        with:
          ssh-private-key: ${{ secrets.JS_RECON_SIGNING_KEY }}
          commit-name: "js-recon-bot"
          commit-email: ${{ secrets.JS_RECON_SIGNING_EMAIL }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Prettier
        run: npm install -g prettier

      - name: Run Prettier
        run: prettier --write . --config .prettierrc

      - name: Remove node_modules
        run: rm -rf node_modules

      - name: Commit changes
        run: |
          git add .
          git commit -m "chore: prettify code" || echo "No changes to commit"
          git push

  validate:
    runs-on: ubuntu-latest
    needs: prettify
    steps:
      - name: Checkout rules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          path: js-recon-rules

      - name: Checkout js-recon (branch matching this rules branch)
        uses: actions/checkout@v4
        with:
          repository: js-recon/js-recon
          ref: ${{ github.head_ref || github.ref_name }}
          path: js-recon

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Build js-recon from source
        working-directory: js-recon
        run: |
          npm ci
          npm run cleanup

      - name: Remove .github directory to prevent reading the workflows as rules
        run: rm -rf js-recon-rules/.github

      - name: Validate rules
        run: node js-recon/build/index.js analyze -r js-recon-rules --validate

      - name: Check rule version compatibility
        run: node js-recon/build/index.js analyze -r js-recon-rules --determine-compatible-version