# Dependabot version updates.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
#
# This repo has no package manager or Dockerfile of its own (pure YAML detection rules + skill
# docs), so the only ecosystem to track is GitHub Actions. Minor + patch bumps are grouped into a
# single weekly PR to cut noise; major bumps open individually so breaking changes get a
# dedicated review. PRs target `dev` — `main` only receives changes via the release flow.
version: 2

updates:
  # GitHub Actions — all uses: refs are pinned to full commit SHAs (Plumber policy); Dependabot
  # updates the SHA and the trailing "# vX.Y.Z" comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
